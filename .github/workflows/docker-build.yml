name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: oasisic-dailypulse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test image
        run: |
          docker run -d --name test -p 8790:8790 -e PULSE_TOKEN=test-token oasisic-dailypulse:latest
          sleep 5
          curl -f -H "x-pulse-token: test-token" http://localhost:8790/api/sources || exit 1
          docker stop test
          echo "✓ Docker image works"
