name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: oasisic-dailypulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dp-data"
          docker run -d --name dp-ci \
            -p 8790:8790 \
            -e PULSE_TOKEN=ci-test-token \
            -v "$RUNNER_TEMP/dp-data:/app/data" \
            oasisic-dailypulse:ci

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -m 5 -H "x-pulse-token: ci-test-token" \
                 http://localhost:8790/api/sources -o "$RUNNER_TEMP/sources.json"; then
              echo "API responded after ${i} attempt(s)"
              ok=1
              break
            fi
            sleep 2
          done

          echo "--- container logs ---"
          docker logs dp-ci || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::API did not respond within 60s"
            exit 1
          fi

          python3 - "$RUNNER_TEMP/sources.json" <<'PYCHECK'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("ok") is True, "api not ok: " + str(d)[:300]
          print("sources count:", len(d.get("sources", {})))
          PYCHECK

          docker rm -f dp-ci

      - name: Dump container logs on failure
        if: failure()
        run: docker logs dp-ci || true
